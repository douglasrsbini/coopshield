<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background-color: #0f1115; color: #3b82f6;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; border-radius: 12px;
    }
    .logo {
      width: 80px; height: 80px; border-radius: 20px;
      background: rgba(59, 130, 246, 0.1);
      border: 2px solid rgba(59, 130, 246, 0.3);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; animation: pulse 2s infinite;
    }
    .loader {
      width: 150px; height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 4px; overflow: hidden; margin-top: 20px;
    }
    .loader-bar {
      height: 100%; width: 50%; background: #3b82f6; border-radius: 4px;
      animation: loading 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
  </div>
  <h1 style="margin:0; font-size: 24px; color: white; letter-spacing: 2px;">COOPSHIELD</h1>
  <p style="margin: 8px 0 0 0; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 4px;">Iniciando Motor Seguro...</p>
  <div class="loader"><div class="loader-bar"></div></div>
</body>
</html>
